<svg width="720" height="200" viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="720" height="200" fill="#ffffff"/>
  <!-- Mean -->
  <g>
    <rect x="10"  y="10" width="100" height="100" rx="8" fill="#0173b2"/>
    <text x="60" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">Mean</text>
    <text x="60" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">#0173b2</text>
  </g>
  <!-- LeakyIntegrator -->
  <g>
    <rect x="120" y="10" width="100" height="100" rx="8" fill="#de8f05"/>
    <text x="170" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">LeakyIntegrator</text>
    <text x="170" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">#de8f05</text>
  </g>
  <!-- PrimacyRecency -->
  <g>
    <rect x="230" y="10" width="100" height="100" rx="8" fill="#029e73"/>
    <text x="280" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">PrimacyRecency</text>
    <text x="280" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">#029e73</text>
  </g>
  <!-- RL_lambda -->
  <g>
    <rect x="340" y="10" width="100" height="100" rx="8" fill="#d55e00"/>
    <text x="390" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">RL_lambda</text>
    <text x="390" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">#d55e00</text>
  </g>
  <!-- NEF -->
  <g>
    <rect x="450" y="10" width="100" height="100" rx="8" fill="#cc78bc"/>
    <text x="500" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">NEF</text>
    <text x="500" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">#cc78bc</text>
  </g>
  <!-- NoisyRL_lambda -->
  <g>
    <rect x="560" y="10" width="100" height="100" rx="8" fill="#ca9161"/>
    <text x="610" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold">NoisyRL_lambda</text>
    <text x="610" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">#ca9161</text>
  </g>
  <text x="10" y="185" font-family="sans-serif" font-size="11" fill="#777">seaborn "colorblind" palette (utils/plot_style.get_palette), indexed by utils/soltani_models.MODEL_ORDER</text>
</svg>
