<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="360" viewBox="0 0 300 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">

  <!-- Title -->
  <text x="150" y="16" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">
    Within-trial residual autocorrelation
  </text>
  <text x="150" y="29" font-size="9" fill="#666666" text-anchor="middle">
    deviation from that trial's own average
  </text>

  <!-- lag bracket between obs t and obs t+1 (drawn first, well clear of subtitle above) -->
  <text x="90" y="48" font-size="9" font-weight="bold" fill="#333333" text-anchor="middle">lag = 1</text>
  <path d="M 60,68 C 60,55 120,55 120,58" fill="none" stroke="#333333" stroke-width="1.2"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- ============ Top: one example trial's residual trace ============ -->
  <!-- baseline (zero) -->
  <line x1="35" y1="105" x2="265" y2="105" stroke="#999999" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="30" y="108" font-size="9" fill="#999999" text-anchor="end">0</text>

  <!-- trace -->
  <polyline points="60,82 120,72 180,112 240,126" fill="none" stroke="#4c4c4c" stroke-width="2"/>
  <circle cx="60" cy="82" r="4" fill="#4c4c4c"/>
  <circle cx="120" cy="72" r="4" fill="#4c4c4c"/>
  <circle cx="180" cy="112" r="4" fill="#4c4c4c"/>
  <circle cx="240" cy="126" r="4" fill="#4c4c4c"/>

  <!-- observation labels -->
  <text x="60" y="142" font-size="9" fill="#333333" text-anchor="middle">obs t</text>
  <text x="120" y="142" font-size="9" fill="#333333" text-anchor="middle">obs t+1</text>
  <text x="180" y="142" font-size="9" fill="#333333" text-anchor="middle">obs t+2</text>
  <text x="240" y="142" font-size="9" fill="#333333" text-anchor="middle">obs t+3</text>

  <text x="150" y="160" font-size="9" fill="#666666" text-anchor="middle" font-style="italic">
    r( residual at t , residual at t+lag ) — one value per person, per lag
  </text>

  <!-- divider -->
  <line x1="20" y1="175" x2="280" y2="175" stroke="#dddddd" stroke-width="1"/>

  <!-- ============ Bottom: two contrasting patterns ============ -->

  <!-- LEFT: persisting / correlated -->
  <text x="80" y="195" font-size="11" font-weight="bold" fill="#4c4c4c" text-anchor="middle">
    Persisting noise
  </text>
  <line x1="30" y1="260" x2="130" y2="260" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="2,2"/>
  <polyline points="30,235 63,225 97,280 130,292" fill="none" stroke="#4c4c4c" stroke-width="2" opacity="1"/>
  <polyline points="30,242 63,248 97,265 130,272" fill="none" stroke="#4c4c4c" stroke-width="2" opacity="0.55"/>
  <polyline points="30,228 63,220 97,278 130,288" fill="none" stroke="#4c4c4c" stroke-width="2" opacity="0.3"/>
  <text x="80" y="310" font-size="8.5" fill="#4c4c4c" text-anchor="middle">
    same sign nearby →
  </text>
  <text x="80" y="321" font-size="8.5" font-weight="bold" fill="#4c4c4c" text-anchor="middle">
    correlated
  </text>

  <!-- RIGHT: independent / uncorrelated -->
  <text x="220" y="195" font-size="11" font-weight="bold" fill="#0173b2" text-anchor="middle">
    Independent noise
  </text>
  <line x1="170" y1="260" x2="270" y2="260" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="2,2"/>
  <polyline points="170,230 203,280 237,240 270,270" fill="none" stroke="#0173b2" stroke-width="2" opacity="1"/>
  <polyline points="170,275 203,235 237,285 270,232" fill="none" stroke="#0173b2" stroke-width="2" opacity="0.55"/>
  <polyline points="170,250 203,220 237,265 270,290" fill="none" stroke="#0173b2" stroke-width="2" opacity="0.3"/>
  <text x="220" y="310" font-size="8.5" fill="#0173b2" text-anchor="middle">
    random sign →
  </text>
  <text x="220" y="321" font-size="8.5" font-weight="bold" fill="#0173b2" text-anchor="middle">
    uncorrelated
  </text>

  <!-- arrow marker def -->
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>
</svg>
