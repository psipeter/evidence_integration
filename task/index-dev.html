<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Evidence Integration — Dev Setup</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    .panel {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 2.5rem 3rem;
      width: 520px;
      max-width: 95vw;
    }
    h2 {
      text-align: center;
      font-size: 2rem;
      color: #1e293b;
      margin: 0 0 0.4rem;
    }
    .subtitle {
      text-align: center;
      font-size: 1.1rem;
      color: #888;
      margin-bottom: 2rem;
    }
    .section-label {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin: 1.5rem 0 0.6rem;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }
    .row-label {
      width: 110px;
      font-size: 0.95rem;
      color: #374151;
      font-weight: 600;
      flex-shrink: 0;
    }
    .btn-group {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .opt-btn {
      font-size: 0.9rem;
      padding: 0.35rem 0.9rem;
      border: 2px solid #d1d5db;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      color: #555;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
    }
    .opt-btn.active {
      background: #1d4ed8;
      border-color: #1d4ed8;
      color: #fff;
    }
    .opt-btn.task-continuous.active { background: #16a34a; border-color: #16a34a; }
    .opt-btn.task-binary.active     { background: #2563eb; border-color: #2563eb; }
    hr { border: none; border-top: 1px solid #e5e7eb; margin: 1.5rem 0 0.5rem; }
    #start-btn {
      display: block;
      width: 100%;
      margin-top: 1.5rem;
      padding: 0.9rem;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      background: #1d4ed8;
      color: #fff;
      cursor: pointer;
      transition: background 0.15s;
    }
    #start-btn:hover { background: #1e40af; }
  </style>
</head>
<body>
<div class="panel">
  <h2>Evidence Integration</h2>
  <div class="section-label">Task</div>
  <div class="row">
    <div class="btn-group" id="opt-task">
      <button class="opt-btn task-continuous active" data-val="continuous">Continuous</button>
      <button class="opt-btn task-binary"            data-val="binary">Binary</button>
    </div>
  </div>

  <div class="section-label">Experiment settings</div>

  <div class="row">
    <span class="row-label">Tutorial</span>
    <div class="btn-group" id="opt-tutorial">
      <button class="opt-btn active" data-val="true">Show</button>
      <button class="opt-btn"        data-val="false">Skip</button>
    </div>
  </div>

  <div class="row">
    <span class="row-label">Trials</span>
    <div class="btn-group" id="opt-trials">
      <button class="opt-btn active" data-val="5">5</button>
      <button class="opt-btn"        data-val="10">10</button>
      <button class="opt-btn"        data-val="20">20</button>
      <button class="opt-btn"        data-val="40">40</button>
    </div>
  </div>

  <div class="row">
    <span class="row-label">BTI (ms)</span>
    <div class="btn-group" id="opt-bti">
      <button class="opt-btn"        data-val="1000">1000</button>
      <button class="opt-btn active" data-val="3000">3000</button>
      <button class="opt-btn"        data-val="5000">5000</button>
    </div>
  </div>


  <div class="row">
    <span class="row-label">ITI (ms)</span>
    <div class="btn-group" id="opt-iti">
      <button class="opt-btn active" data-val="1000">1000</button>
      <button class="opt-btn"        data-val="2000">2000</button>
      <button class="opt-btn"        data-val="5000">5000</button>
    </div>
  </div>

  <div class="row">
    <span class="row-label">Distractor</span>
    <div class="btn-group" id="opt-distractor">
      <button class="opt-btn active" data-val="none">None</button>
      <button class="opt-btn"        data-val="iti_length">ITI length</button>
      <button class="opt-btn"        data-val="popup">Popup</button>
    </div>
  </div>

  <hr>
  <button id="start-btn">Start experiment →</button>
</div>

<script type="module">
  // imports must be at top level of ES module
  import { config as configContinuous } from '/src/continuous/config.js';
  import { config as configBinary }     from '/src/binary/config.js';
  import { buildAndRun }                from '/src/shared/timeline-builder.js';
  import '/src/shared/jatos-shim.js';

  // ── URL param overrides ──────────────────────────────────────────────────
  // Lets automated tests (and quick manual links) drive this page without
  // touching source files: e.g.
  //   index-dev.html?task=binary&tObsMs=1500&btiMs=200&tutorial=false&trials=3&autostart=1
  //
  // task/tutorial/distractor are constrained to the same fixed options as the
  // button groups (pre-selects a button if the value matches).
  //
  // trials/btiMs/itiMs/tObsMs are free-form numeric overrides — NOT limited
  // to the button-group presets (those exist for convenient manual clicking;
  // automated tests need arbitrary values like trials=3 or btiMs=200, which
  // may not correspond to any button). These win over the button selection
  // whenever present in the URL.
  const qp = new URLSearchParams(window.location.search);

  // ── Toggle button groups ─────────────────────────────────────────────────
  document.querySelectorAll('.btn-group').forEach(group => {
    group.querySelectorAll('.opt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        group.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
  });

  // Pre-select a button group value from a URL param, if present and valid.
  const applyParamToGroup = (groupId, paramName) => {
    const val = qp.get(paramName);
    if (val == null) return;
    const group = document.getElementById(groupId);
    const btn   = group?.querySelector(`.opt-btn[data-val="${val}"]`);
    if (btn) {
      group.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  };
  applyParamToGroup('opt-task',       'task');
  applyParamToGroup('opt-tutorial',   'tutorial');
  applyParamToGroup('opt-distractor', 'distractor');

  const pick    = (id) => document.querySelector(`#${id} .opt-btn.active`)?.dataset.val;
  const numParam = (name, fallbackFromGroupId) => {
    if (qp.has(name)) return parseInt(qp.get(name), 10);
    return parseInt(pick(fallbackFromGroupId), 10);
  };

  function start() {
    const task           = pick('opt-task');
    const showTutorial   = pick('opt-tutorial') === 'true';
    const distractorType = pick('opt-distractor');

    // Free-form numeric overrides (see comment above) — fall back to the
    // active button value when not present in the URL.
    const nTrials    = numParam('trials', 'opt-trials');
    const btiMs      = numParam('btiMs',  'opt-bti');
    const trialItiMs = numParam('itiMs',  'opt-iti');
    // tObsMs (observation response deadline) has no button in the UI at
    // all — it's only ever a URL override, primarily for fast E2E tests.
    const tObsMsOverride = qp.has('tObsMs') ? parseInt(qp.get('tObsMs'), 10) : null;

    const baseConfig = task === 'binary' ? configBinary : configContinuous;

    // Hide setup panel — must happen before buildAndRun mounts jsPsych
    document.querySelector('.panel').remove();

    // All settings resolved before buildAndRun; timeline built with correct values
    buildAndRun({
      ...baseConfig,
      nTrialsDefault: nTrials,  // dev page overrides config default
      btiMs,
      trialItiMs,
      distractorType,
      testMode:     true,
      showTutorial,
      ...(tObsMsOverride != null ? { tObsMs: tObsMsOverride } : {}),
    });
  }

  document.getElementById('start-btn').addEventListener('click', start);

  // ?autostart=1 — used by Playwright tests to skip the manual click entirely.
  if (qp.get('autostart') === '1') start();
</script>
</body>
</html>
