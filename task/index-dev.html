<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dev launcher</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
      gap: 1.5rem;
    }
    h2 { color: #444; margin: 0; }
    .btn-row { display: flex; gap: 1.5rem; }
    a {
      display: inline-block;
      padding: 0.8rem 2.5rem;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: bold;
      text-decoration: none;
      color: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .btn-continuous { background: #16a34a; }
    .btn-continuous:hover { background: #15803d; }
    .btn-binary { background: #2563eb; }
    .btn-binary:hover { background: #1d4ed8; }
    p { color: #888; font-size: 0.9rem; margin: 0; }
  </style>
</head>
<body>
  <h2>Evidence Integration — Dev Launcher</h2>
  <div class="btn-row">
    <a class="btn-continuous" href="/index-continuous.html">Continuous task</a>
    <a class="btn-binary"     href="/index-binary.html">Binary task</a>
  </div>
  <p>Both tasks run from the same dev server. No restart needed to switch.</p>
</body>
</html>
