<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session complete</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .box {
        text-align: center;
        max-width: 480px;
        padding: 2.5rem 3rem;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      }
      h2 { font-size: 1.8rem; color: #1f2937; margin-bottom: 1rem; }
      p { font-size: 1.15rem; color: #555; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Session complete</h2>
      <p>Your data has been saved. You may now close this window.</p>
    </div>
  </body>
</html>
